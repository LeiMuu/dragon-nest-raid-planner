<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龍之谷｜龍巢穴建團管理器</title>
<style>
:root{--bg:#f1f4f4;--c:#fbfcfc;--t:#34454f;--m:#73838c;--p:#4f8f88;--r:#c9605a;--bd:#dde4e6;--i:#e6f1ef}
@media(prefers-color-scheme:dark){:root{--bg:#1a2429;--c:#222e34;--t:#cfdbe0;--m:#8a9ba4;--bd:#34444c;--p:#7fbfb6;--i:#1f3638}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,"Noto Sans TC","PingFang TC",sans-serif;padding:56px 0 20px 76px}
header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--c);border-bottom:1px solid var(--bd);z-index:5;font-weight:700;font-size:16px}header img{height:38px}header small{color:var(--m);font-weight:400;margin-left:8px}
main{max-width:720px;margin:auto;padding:12px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
nav{position:fixed;top:56px;bottom:0;left:0;width:76px;display:flex;flex-direction:column;background:var(--c);border-right:1px solid var(--bd);padding:8px 0;z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:12px 0;color:var(--m);font-size:11px;text-align:center;line-height:1.25}nav button.on{color:var(--p);font-weight:700;background:var(--bg);box-shadow:inset 3px 0 var(--p)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:760px){nav{width:168px}nav button{flex-direction:row;gap:10px;padding:12px 18px;font-size:15px}body{padding-left:168px}}
input,select,button,textarea{font:inherit;color:inherit}
input,select{border:1px solid var(--bd);background:var(--c);border-radius:8px;padding:8px;width:100%;margin:3px 0}
.b{background:var(--p);color:var(--c);border:0;border-radius:8px;padding:8px 14px;margin:3px 0}.b.g{background:none;color:var(--p);border:1px solid var(--p)}.b.d{background:var(--r);color:#fff}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;margin:2px;color:#fff;font-size:13px;border:0}
.w{color:var(--r);font-size:13px}.m{color:var(--m);font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.s{flex:none}
.sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}
.sh>div{background:var(--c);width:100%;max-height:78vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--m);font-size:13px;font-weight:600}.b.sm{padding:3px 10px;font-size:13px}summary{cursor:pointer}
.pf{outline:2px solid #d9a441;border-radius:8px;padding:2px 4px}
svg text{pointer-events:none}svg g{cursor:pointer}
details{font-size:13px;color:var(--m);margin-bottom:10px}textarea{width:100%;height:260px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}
main>details{background:var(--i);border:1px solid var(--bd);border-left:4px solid var(--p);border-radius:8px;padding:10px 12px;color:var(--t);font-size:14px}
main>details summary{font-weight:700;color:var(--p)}main>details summary::before{content:"ℹ️ "}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}.dn{font-size:19px;font-weight:700;color:var(--p)}.pc{background:var(--p);color:var(--c);border-radius:99px;padding:1px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.dt{font-size:17px;font-weight:700}.rn{color:var(--m);font-size:14px}.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}.acts .b{flex:none;margin:0}
.sh.mid{align-items:center;justify-content:center;padding:14px}.sh.mid>div{border-radius:14px;max-width:700px;max-height:92vh}
.jg{width:100%;border:1px solid var(--bd)}.jg th,.jg td{border:1px solid var(--bd);padding:6px}.jg th{width:88px;background:var(--bg);text-align:center;vertical-align:middle}
.jb{border:1px solid var(--c);color:var(--c);background:none;border-radius:6px;padding:4px 12px;margin:2px;font-size:14px}.jb.on{background:var(--c);color:#fff}
.rt{background:var(--p);color:var(--c);padding:7px 12px;border-radius:8px;font-weight:700;margin:14px 0 8px}.b.sm{margin:3px 4px 3px 0}
.pi{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}.pi:hover{background:var(--bg)}.sh.mid>div{box-shadow:0 10px 40px #0007}
nav,body{transition:width .2s,padding .2s}#nt{margin-top:auto;border-top:1px solid var(--bd)}
body.nc{padding-left:56px}body.nc nav{width:56px}body.nc nav span{display:none}body.nc nav button{padding:14px 0;justify-content:center}body.nc #nt svg{transform:rotate(180deg)}
.mc{margin:6px 0 2px}.mc .chip{font-size:14px;padding:3px 12px}.mc small{opacity:.85;font-size:12px}
#hb{display:none;border:0;background:none;padding:4px;color:var(--t);line-height:0}#hb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}#nbd{display:none}nav{transition:width .2s,transform .2s}
@media(max-width:599px){#hb{display:block}body,body.nc{padding-left:0}#nt{display:none}
nav,body.nc nav{width:200px;z-index:8}nav{box-shadow:0 0 30px #0006}nav button,body.nc nav button{flex-direction:row;gap:12px;padding:14px 18px;font-size:15px;justify-content:flex-start;text-align:left}
body.nc nav span{display:inline}body.nc nav{transform:translateX(-100%);box-shadow:none}
body:not(.nc) #nbd{display:block;position:fixed;inset:56px 0 0 0;background:#0007;z-index:7}}
</style></head><body>

sheet(`<div class=rt style="margin-top:0">${r.t}・${lab(rid,s)}</div>${o.length?`<div class=m>目前配置</div>${L(o,m=>`<div class="row pi"><span><b>${e(m.n)}</b></span>${chip(m.j)}<button class="b d sm s" onclick="rm('${rid}','${s}','${m.id}')">移除</button></div>`)}`:''}
<div class=m style="margin-top:8px">可選成員${o.length>=r.c?'（此位置已滿，選人將取代）':''}${hp?'　★＝此位置偏好':''}</div>
${L(av,m=>`<div class="row pi ${isPf(rid,s,m)?'pf':''}" onclick="put('${rid}','${s}','${m.id}')"><span>${e(m.n)} ${isPf(rid,s,m)?'★':''}</span>${chip(m.j)}</div>`)||`<div class=m>${E.att.length?'所有出席成員都已分配在此回合':'尚未勾選出席成員，請先在「出席成員」勾選'}</div>`}`,'mid')}
function put(rid,s,id){const a=E.a[rid]||(E.a[rid]={}),o=a[s]||(a[s]=[]);if(o.length>=RD[rid].c)o.shift();o.push({...E.att.find(x=>x.id==id)});cl();render()}
function rm(rid,s,id){E.a[rid][s]=E.a[rid][s].filter(x=>x.id!=id);cl();render()}
function auto(){const r=RD[RI],a=E.a[RI]={},left=[...E.att];r.s.forEach(x=>a[x]=[]);for(let k=0;k<r.c;k++)r.s.forEach(x=>{const i=left.findIndex(m=>isPf(RI,x,m));if(i>=0&&a[x].length<r.c)a[x].push(left.splice(i,1)[0])});for(let k=0;k<r.c;k++)r.s.forEach(x=>{if(left.length&&a[x].length<=k)a[x].push(left.shift())});render()}
function newRaid(){if((E.name||E.att.length)&&!confirm('目前編輯內容將被捨棄，確定開新出團？'))return;E=newE();render()}
function saveE(){const mi=[];if(!E.name.trim())mi.push('出團名稱');if(!E.date)mi.push('出團日期');if(!E.time)mi.push('出團時間');if(!E.att.length)mi.push('出席成員（至少勾選 1 位）');if(mi.length)return alert('無法儲存，請補上以下資訊：\n'+mi.map(x=>'• '+x).join('\n'));const x=JSON.parse(JSON.stringify(E));x.name=x.name.trim();if(x.id)S.records[S.records.findIndex(r=>r.id==x.id)]=x;else{x.id=uid();S.records.unshift(x)}E=null;save();T='r';render();scrollTo(0,0)}

/* 紀錄 */
let RQ='';
const rrows=()=>{const q=RQ.trim().toLowerCase();return L([...S.records].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).filter(r=>!q||(r.name+' '+D[r.d].n+' '+r.date+' '+r.att.map(a=>a.n).join(' ')).toLowerCase().includes(q)),r=>`<div class=card><div class=rh><span class=dn>${D[r.d].n}</span><span class=pc>${r.att.length} 人</span></div><div class=dt>${r.date}（${'日一二三四五六'[new Date(r.date+'T00:00').getDay()]}） ${r.time}</div><div class=rn>${e(r.name)}</div><div class=mc>${L(r.att,a=>`<span class=chip style="background:${col(a.j)}">${e(a.n)} <small>${e(a.j)}</small></span>`)}</div><div class=acts><button class="b g sm" onclick="pv('${r.id}')">預覽</button><button class="b g sm" onclick="ed('${r.id}',0)">編輯</button><button class="b g sm" onclick="ed('${r.id}',1)">複製</button><button class="b d sm" onclick="if(confirm('刪除此紀錄？')){S.records=S.records.filter(x=>x.id!='${r.id}');save();render()}">刪除</button></div></div>`)||`<div class=m>${S.records.length?'沒有符合的紀錄':'尚無紀錄'}</div>`};
V.r=()=>`<details open><summary>使用步驟</summary>① 「預覽」產生 Discord 訊息並一鍵複製<br>② 「編輯」回到出團畫面修改<br>③ 「複製」帶入舊設定開新團，只需改日期時間</details><div class=card><input type=search placeholder="搜尋出團名稱、副本、日期或成員" value="${e(RQ)}" oninput="RQ=this.value;$('#rl').innerHTML=rrows()"></div><div id=rl>${rrows()}</div>`;
function ed(id,cp){E=JSON.parse(JSON.stringify(S.records.find(x=>x.id==id)));if(cp){delete E.id;E.name+=' (複製)';E.date=today()}T='e';render();scrollTo(0,0)}
function msg(r){const W='日一二三四五六'[new Date(r.date+'T00:00').getDay()],o=[`**【${D[r.d].n}】${+r.date.slice(5,7)}/${+r.date.slice(8)}（${W}）${r.time} ─ ${r.name}**`,`👥 出團成員（${r.att.length}）：${r.att.map(a=>`${a.n}(${a.j})`).join('、')}`];
D[r.d].R.forEach(k=>{const R=RD[k],a=r.a[k]||{};o.push('',`**${R.t}**`);R.s.forEach(s=>{const l=a[s]||[];if(l.length)o.push((R.em?R.em[s]+' ':(k=='r3'?s:lab(k,s))+'：')+l.map(m=>m.n+(R.nj?'':`(${m.j})`)).join('、')+(R.ice&&R.ice[s]?`（${R.ice[s]}）`:''))})});return o.join('\n')}
function pv(id){sheet(`<b>預覽出團訊息</b><textarea id=ta readonly style="height:min(60vh,560px);margin:8px 0">${e(msg(S.records.find(x=>x.id==id)))}</textarea><button class=b style="width:100%" onclick=cp()>複製到剪貼簿</button>`,'mid')}
function cp(){const t=$('#ta');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy')).then(()=>alert('已複製，可貼到 Discord'))}

/* 設定 */
V.s=()=>`<details open><summary>使用步驟</summary>① 定期「匯出」備份，避免瀏覽器資料遺失<br>② 在職業管理新增自訂職業<br>③ 建立職業限制 SET，出團時會檢查<br>④ 設定各 R 的偏好職業，分配時會標示★</details>
<div class=card><b>資料備份</b><div class=m>資料只存在這個瀏覽器，請定期匯出備份。</div><div class=m>上次匯出：${S.lastEx?new Date(S.lastEx).toLocaleString('sv'):'尚未匯出'}</div><div class=row><button class=b onclick=ex()>匯出</button><button class="b g" onclick="im(0)">匯入（覆蓋）</button><button class="b g" onclick="im(1)">匯入（合併）</button></div><input id=f type=file accept=.json hidden onchange=imp(this)></div>
<div class=card><b>職業管理</b><div class=m>五大基礎職業不可刪除；其他職業若有成員使用則不可刪除。</div><div>${L(S.jobs,(j,i)=>`<span class=chip style="background:${col(j.n)}">${e(j.n)} <a onclick="dj(${i})">✕</a></span>`)}</div><div class=row><input id=jn placeholder="新職業名稱"><select id=jb>${L(Object.keys(BC),b=>`<option>${b}</option>`)}</select><button class="b s" onclick=aj()>新增</button></div></div>
<div class=card><b>職業限制 SET</b><div class=m>限制出團至少要有的職業，基礎職業或一轉職業皆可，可建立多組。</div>${L(S.sets,s=>`<div class=row><span>${e(s.n)} <span class=m>${D[s.d].n}：${Object.entries(s.req).map(x=>x.join('≥')).join('、')}</span></span><button class="b d s" onclick="S.sets=S.sets.filter(x=>x.id!='${s.id}');save();render()">✕</button></div>`)}
<input id=sn placeholder="SET 名稱"><select id=sd>${L(Object.keys(D),k=>`<option value=${k}>${D[k].n}</option>`)}</select><div class=row>${L(names(),k=>`<label class=m style="flex:0 0 30%">${e(k)}<input type=number min=0 max=8 class=rq data-k="${e(k)}"></label>`)}</div><button class=b onclick=as()>新增 SET</button></div>
<div class=card><b>偏好職業</b><div class=m>每個位置可各自設定（可選基礎職業或一轉職業）。建立出團分配時，符合的成員會以黃框★標示，自動分配也會優先採用。</div>
${L(Object.keys(RD),r=>{const R=RD[r],s=psl(r),o=S.pref[r]||{},sel=o[s]||[];return `<div class=rt>${R.t}</div><div>${L(R.s,x=>`<button class="b sm ${x==s?'':'g'}" onclick="psel('${r}','${x}')">${lab(r,x)}${(o[x]||[]).length?' ·'+o[x].length:''}</button>`)}</div><div class=m style="margin:6px 0"><b>${lab(r,s)}</b> 偏好：${sel.length?sel.map(e).join('、'):'未設定'}</div>${jgrid(`tpf.bind(null,'${r}')`,sel,1)}<button class="b g sm" onclick="pall('${r}')">套用到所有位置</button><button class="b g sm" onclick="pclr('${r}')">清除此位置</button>`})}</div>`;
const PS={},psl=r=>PS[r]||RD[r].s[0];
const psel=(r,x)=>{PS[r]=x;render()};
function tpf(r,k){const o=S.pref[r]||(S.pref[r]={}),p=o[psl(r)]||(o[psl(r)]=[]),i=p.indexOf(k);i<0?p.push(k):p.splice(i,1);save();render()}
const pall=r=>{const o=S.pref[r]||(S.pref[r]={}),v=o[psl(r)]||[];RD[r].s.forEach(x=>o[x]=[...v]);save();render()};
const pclr=r=>{(S.pref[r]||(S.pref[r]={}))[psl(r)]=[];save();render()};
function aj(){const n=$('#jn').value.trim();if(!n||BC[n]||S.jobs.some(j=>j.n==n))return alert('名稱空白或重複');S.jobs.push({n,b:$('#jb').value});save();render()}
function dj(i){const n=S.jobs[i].n;if(S.members.some(m=>m.j.some(x=>x.n==n)))return alert(`已有成員使用「${n}」，無法刪除`);S.jobs.splice(i,1);save();render()}
function as(){const n=$('#sn').value.trim(),req={};document.querySelectorAll('.rq').forEach(i=>{if(+i.value>0)req[i.dataset.k]=+i.value});if(!n||!Object.keys(req).length)return alert('請填名稱並設定至少一項職業');S.sets.push({id:uid(),n,d:$('#sd').value,req});save();render()}
function ex(){S.lastEx=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`dragon-nest-${today()}.json`;a.click();render()}
const im=m=>{mode=m;$('#f').click()};
function imp(i){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.members)throw 0;if(!mode){if(!confirm('將覆蓋目前所有資料，確定？'))return;S=Object.assign(def(),x)}else{['members','teams','sets','records'].forEach(k=>(x[k]||[]).forEach(v=>S[k].some(y=>y.id==v.id)||S[k].push(v)));(x.jobs||[]).forEach(v=>S.jobs.some(y=>y.n==v.n)||S.jobs.push(v));S.pref={...x.pref,...S.pref};S.guild=S.guild||x.guild}mig();E=null;TM=null;M={n:'',j:[]};save();render()}catch(_){alert('檔案格式錯誤')}};r.readAsText(i.files[0]);i.value=''}
render();
</script></body></html>
